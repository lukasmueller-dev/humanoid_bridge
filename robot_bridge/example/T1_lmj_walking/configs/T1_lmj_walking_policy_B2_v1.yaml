# policy_B2_v1: loco-mujoco-t1 parallel_act, conf_t1_crank_B2_wide_clip_penalty (W&B 202607_boosterT1,
# B2_wide_ankle_clip_penalty_2p4b). Trained with CrankLimitedPDControl: the serial ankle PD below, its torque
# mapped to the crank motors and clipped at 43 Nm each. Run it with the bridge's parallel_ankle_mapping on
# (bridge/robot_bridge/params/T1_config_parallel.yaml). Actor: export_actor_npz.py models/policy_B2_v1.pkl.

common:
  dt: 0.002
  stiffness: [
    20.0, 20.0,
    20.0, 20.0, 20.0, 20.0,
    20.0, 20.0, 20.0, 20.0,
    200.0,
    200.0, 200.0, 200.0, 200.0, 50.0, 50.0,
    200.0, 200.0, 200.0, 200.0, 50.0, 50.0
  ]
  damping: [
    0.2, 0.2,
    0.5, 0.5, 0.5, 0.5,
    0.5, 0.5, 0.5, 0.5,
    5.0,
    5.0, 5.0, 5.0, 5.0, 3.0, 3.0,
    5.0, 5.0, 5.0, 5.0, 3.0, 3.0
  ]
  default_qpos: [
    0.0, 0.0,
    0.2, -1.35, 0.0, -0.5,
    0.2, 1.35, 0.0, 0.5,
    0.0,
    -0.2, 0.0, 0.0, 0.4, -0.25, 0.0,
    -0.2, 0.0, 0.0, 0.4, -0.25, 0.0
  ]

policy:
  actor_path: "models/policy_B2_v1_actor_81d.npz"
  source_checkpoint_path: "models/policy_B2_v1.pkl"
  num_actions: 23
  num_observations: 81
  include_height_in_obs: true
  gait_frequency: 1.25
  goal_height: 0.67
  command_rate_limit_per_step: 0.02

  control:
    action_scale: 1.0
    clip_actions: 1.0
    decimation: 10
    target_qpos_lower: [
      -1.012, -0.314,
      -3.281, -1.64, -2.234, -2.094,
      -3.281, -1.536, -2.234, 0.000,
      -1.012,
      -2.059, -0.366, -1.012, 0.000, -0.87, -0.44,
      -2.059, -1.57, -1.0, 0.000, -0.87, -0.45
    ]
    target_qpos_upper: [
      1.012, 0.82,
      1.187, 1.536, 2.234, 0.035,
      1.187, 1.64, 2.234, 2.094,
      1.012,
      2.059, 1.536, 1.012, 2.146, 0.35, 0.44,
      2.059, 0.2, 1.0, 2.15, 0.35, 0.45
    ]

command:
  step:
    x: 0.05
    y: 0.05
    yaw: 0.05
  limit:
    x: [-0.2, 0.3]
    y: [-0.2, 0.2]
    yaw: [-0.3, 0.3]

mech:
  parallel_mech_indexes: [15, 16, 21, 22]
