# Self-contained: this package goes to the Jetson on its own, so its tool config
# cannot live in the repo root.

[tool.ruff]
line-length = 100
# The Jetson runs JetPack 5.1.1: Python 3.8.
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
