robot: t1
control:
  dt: 0.02
  command_frequency: 50
  initial_settle_time: 2.0
  max_delta_per_step: 0.2
  max_target_velocity: null
  enable_robot_command: true
  dry_run: false
  interpolation_order: 0.8
pose:
  start_pose_name: prepare
  start_joint_positions: null
  start_stiffness: null
  start_damping: null
  nominal_pose_name: prepare
  nominal_joint_positions: null
  command_gains_name: common
  command_stiffness: null
  command_damping: null
  deployment_config_path: robot_bridge/example/T1/configs/T1_tune.yaml
experiment:
  selected_joint: LeftAnklePitch
  command_type: step
  amplitude: 1
  pre_hold_time: 1.0
  hold_time: 2.0
  post_hold_time: 2.0
  frequency: 0.5
  ramp_duration: 1.0
  total_time: null
  chirp_enabled: false
  chirp_start_frequency: 0.25
  chirp_end_frequency: 2.0
safety:
  use_joint_limits: true
  joint_limit_margin: 0.05
  joint_limits_config_path: robot_bridge/params/T1_config.yaml
  abort_on_large_tracking_error: true
  max_tracking_error: 0.5
  abort_on_large_velocity: true
  max_joint_velocity: 8.0
  selected_joint_max_velocity: 6.0
  return_to_nominal_on_exit: true
  return_duration: 2.0
  stop_control_on_exit: false
logging:
  output_root: logs/real_joint_response
  save_csv: true
  save_npz: true
  save_full_vectors: true
